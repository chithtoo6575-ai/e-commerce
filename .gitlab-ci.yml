# GitLab Pages deployment for the Vite frontend.
# GitLab Pages serves static files only; the Node/SQLite backend (server.js) is not included.

image: node:22.13.0

cache:
  paths:
    - node_modules/

pages:
  stage: deploy
  script:
    - npm ci
    - VITE_SUPABASE_URL="$VITE_SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" npm run build
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as CI/CD variables in GitLab.
